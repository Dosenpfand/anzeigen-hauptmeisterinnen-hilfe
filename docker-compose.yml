version: '3.8'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      # - OPENROUTER_API_KEY=${OPENROUTER_API_KEY} # Set this in a .env file or your environment
      - RATE_LIMIT_REQUESTS=${RATE_LIMIT_REQUESTS:-20}
      - RATE_LIMIT_HOURS=${RATE_LIMIT_HOURS:-10}
    env_file:
      - .env
    # For development
    volumes:
      - ./app.py:/app/app.py
      - ./static:/app/static
